armor_detector:
  ros__parameters:
    debug: true
    target_frame: "odom"
    debug_pose_compare: false
    publish_in_target_frame: false

    backend:
      type: "openvino"
      device: "GPU"
      precision: "fp16"
      model_path: "package://armor_detector_nn/model/demo01/best.onnx"
      engine_path: "package://armor_detector_nn/model/RobotDetectionModel/0526.onnx"
      openvino_model_xml: ""
      openvino_model_bin: ""
      input_name: "images"
      output_names: ["output"]
      warmup_iterations: 10
      num_threads: 2
      allow_fallback: true
      fallback_type: "onnxruntime"

    preprocess:
      input_width: 640
      input_height: 640
      input_layout: "nchw"
      input_color: "rgb"
      resize_mode: "letterbox"
      normalize: true
      mean: [0.0, 0.0, 0.0]
      std: [255.0, 255.0, 255.0]
      pad_value: 114.0

    postprocess:
      strategy: "robotpilots_landmark"
      output_layout: "candidates_first"
      num_classes: 14
      num_keypoints: 4
      keypoint_dims: 2
      bbox_offset: 0
      class_offset: 4
      keypoint_offset: 18
      box_format: "xyxy_from_kpts"
      conf_threshold: 0.7
      nms_threshold: 0.3
      max_detections: 32
      class_agnostic_nms: false
      keypoint_remap: [0, 1, 2, 3]
      head_already_applied: true
      keypoint_auto_reorder: true

    label_map:
      path: "package://armor_detector_nn/config/label_map.yaml"

    quality_filter:
      enabled: true
      min_armor_ratio: 1.0
      max_armor_ratio: 5.0
      max_side_ratio: 1.5
      max_rectangular_error_deg: 25.0
      min_lightbar_length_px: 4.0
      min_area_px: 40.0
      deduplicate_enabled: true
      duplicate_iou_threshold: 0.60
      duplicate_keypoint_mean_dist_px: 8.0

    pose:
      pnp_method: "ippe"
      small_armor_width: 0.133
      small_armor_height: 0.050
      large_armor_width: 0.225
      large_armor_height: 0.050
      force_pnp_rotate_180: false

      depth_correction:
        enabled: false
        min_depth_delta_m: 0.08
        blend_alpha: 0.85
        max_correction_m: 0.60
        max_scale: 1.35
        min_lightbar_length_px: 4.0

      refiner:
        mode: "single_yaw"

      single_yaw:
        max_iterations: 12
        huber_delta: 4.0
        pitch_deg_default: 15.0
        roll_deg_default: 0.0
        outpost_pitch_sign: true

      sliding:
        window_size: 8
        min_frames: 4
        max_time_span_ms: 300.0
        max_solver_time_ms: 2.0
        max_opt_iters: 12
        sigma_prior_xy: 0.08
        sigma_prior_z: 0.15
        sigma_prior_yaw: 0.35
        sigma_smooth_xy: 0.05
        sigma_smooth_z: 0.10
        sigma_smooth_yaw: 0.10
        sigma_kp_min: 1.0
        sigma_kp_scale: 5.0
        huber_delta: 3.0

      gate:
        max_raw_reproj_error: 4.0
        max_reproj_error: 5.0
        max_pose_delta_m: 0.35
        max_yaw_delta_deg: 35.0
        require_finite: true

    tracker:
      strategy: "internal_iou"
      iou_threshold: 0.20
      max_missed: 15
      min_hits: 2
      max_center_dist_px: 180

    corner_refine:
      enabled: false
      method: "sp25_lightbar"
      apply_on_confirmed_only: true
      max_targets_per_frame: 1
      time_budget_ms: 2.0
      roi_expand_ratio: 1.1
      min_bright_points: 50
      pca_stability_threshold: 0.85
      max_aspect_ratio: 5.0
      min_aspect_ratio: 1.5
      max_corner_shift_px: 5.0
      max_mean_corner_shift_px: 2.5
      max_refined_center_shift_px: 2.0
      min_refine_quality: 0.88
      preserve_perspective: true
      max_edge_angle_delta_deg: 12.0
      max_area_ratio_delta: 0.12
      max_length_ratio_delta: 0.20
      full_roi_expand_ratio: 1.45
      binary_threshold: 150.0
      min_contour_area_px: 6.0
      min_lightbar_length_px: 6.0
      min_lightbar_ratio: 1.4
      max_lightbar_ratio: 20.0
      max_lightbar_angle_error_deg: 45.0
      max_rectangular_error_deg: 0.0
      max_side_ratio: 2.2
      max_lightbar_match_error_px: 26.0
      max_pair_center_shift_px: 45.0

    runtime:
      color_filter_source: "model"
      publish_empty: true
      copy_policy: "copy_on_write_debug"
      profile: true
