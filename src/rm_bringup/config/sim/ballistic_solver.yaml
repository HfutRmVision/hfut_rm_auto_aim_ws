# Ballistic Solver 弹道解算参数配置
# 该配置文件定义了弹道解算的所有参数

ballistic_solver:
  ros__parameters:
    # ============================================================================
    # 弹道基本参数
    # ============================================================================
    
    # 子弹速度 (m/s)
    # 根据枪管类型和子弹类型调整
    # - 17mm 子弹: 约 15-30 m/s
    # - 42mm 子弹: 约 10-16 m/s
    bullet_speed: 20.0
    
    # 重力加速度 (m/s^2)
    gravity: 9.8
    
    # 空气阻力系数
    # 该系数影响弹道轨迹的弯曲程度
    # 典型值: 0.0001 - 0.01
    air_resistance: 0.01
    
    # ============================================================================
    # 迭代求解参数
    # ============================================================================
    
    # 最大迭代次数
    # 用于 pitch 角的迭代求解和移动目标预测
    max_iterations: 50
    
    # 收敛阈值 (米)
    # 当迭代误差小于该值时认为已收敛
    convergence_threshold: 0.001
    
    # ============================================================================
    # 补偿器类型
    # ============================================================================
    
    # 弹道补偿器类型
    # - "ideal": 理想模型,不考虑空气阻力 (计算更快)
    # - "resistance": 考虑空气阻力 (更精确)
    compensator_type: "resistance"
