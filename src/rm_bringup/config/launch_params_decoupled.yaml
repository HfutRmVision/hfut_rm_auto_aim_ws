# ========================================
# 解耦架构集成测试启动参数配置
# ========================================

# --------- 通用参数 ---------
# 机器人配置标签，用于选择 rm_bringup/config/<robot>/ 下的真实参数
robot: 'leg'  # 可选: 'video_test', 'hero', 'infantry_4_1', 'leg', 'uav', 'sim'

# 命名空间 所有节点、话题都会以这个命名空间开头
namespace: ''

# image_source: (video | mindvision | hik )
image_source: 'video'

# true: 虚拟下位机 false: 实车
virtual_serial: true

# true: 开启调试模式 (发布可视化markers)
debug: true

# enable_auto_buff: (true | false) 是否开启打符链路
enable_auto_buff: false

# detector_type: (armor_detector | armor_detector_nn)
# armor_detector:    使用传统 OpenCV 灯条检测器
# armor_detector_nn: 使用神经网络检测器
detector_type: 'armor_detector'

# use_camera_detector_container: (true | false)
# true:  相机节点和检测节点放在同一 ComposableNodeContainer 中 (intra-process 零拷贝)
# false: 相机节点和检测节点分别作为独立节点运行
use_camera_detector_container: false

# tracker_impl: (cpp | python)
# cpp:    使用 C++ 组件节点 (rclcpp_components)
# python: 使用 Python 独立节点
tracker_impl: 'cpp'

# --------- 仿真启动参数 ---------
# bringup_sim.launch.py 默认读取 rm_bringup/config/sim 下的子模块参数
sim:
  robot: 'sim'
  detector_type: 'armor_detector_nn'   #armor_detector_nn or armor_detector
  debug: true
  # The custom Webots camera controller publishes ROS time from the system clock
  # and does not publish /clock. Keep simulation bringup on wall time so image
  # stamps and simulator TF stamps are in the same time domain.
  use_sim_time: false
  use_detector: true
  start_ballistic_solver: true
  armors_topic: '/armor_detector/armors'
  cmd_gimbal_topic: '/armor_solver/cmd_gimbal'

# --------- 相机/URDF参数 ---------
# 舵轮 6mm 相机相对于里程计的位姿 (相机安装位置)
# odom2camera:
#   xyz: "\"0.151 0.00  0.040\""
#   rpy: "\"0.0  0.0  0.000\""

# 腿 6mm 相机相对于里程计的位姿 (相机安装位置)
odom2camera:
  xyz: "\"0.12514 0.000 0.0505 \""
  rpy: "\"0.0  0.0  -0.00\""

# # 英雄
# odom2camera:
#   xyz: "\"0.174275 0.000 0.086463 \""
#   rpy: "\"0.0  0.1396  -0.00\""

# # 哨兵
# odom2camera:
#   xyz: "\"0.174275 0.000 0.086463 \""
#   rpy: "\"0.0  0.1396  -0.00\""

# --------- 节点启动延迟 (秒) ---------
# 用于控制节点启动顺序，确保依赖关系正确
delays:
  serial: 1.5
  camera_detector: 2.0
  ballistic_solver: 2.0
  armor_tracker: 2.5
  robot_pose_estimator: 3.0
  target_selector: 3.5
  trajectory_planner: 4.0

# --------- 解耦架构数据流 ---------
# armor_detector/armors
#       ↓
# armor_tracker/tracked_armors
#       ↓
# robot_pose_estimator/robots + robot_pose_estimator/virtual_armors
#       ↓
# target_selector/selected_target
#       ↓
# trajectory_planner/gimbal_cmd
#       ↑
# ballistic_solver (服务)
